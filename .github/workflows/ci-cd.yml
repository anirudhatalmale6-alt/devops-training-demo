name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ============================================
  # STAGE 1: CONTINUOUS INTEGRATION (CI)
  # Automatically check and validate on every push
  # ============================================
  test:
    name: Run Checks (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Team Messages File Exists
        run: |
          echo "Checking that team_messages.txt exists..."
          if [ -f "team_messages.txt" ]; then
            echo "SUCCESS: team_messages.txt found!"
          else
            echo "ERROR: team_messages.txt is missing!"
            exit 1
          fi

      - name: Count Team Messages
        run: |
          echo "=========================================="
          echo "  TEAM MESSAGE BOARD STATUS"
          echo "=========================================="
          echo ""
          LINES=$(grep -c ":" team_messages.txt || true)
          echo "Total messages found: $LINES"
          echo ""
          echo "Current messages:"
          echo "------------------------------------------"
          cat team_messages.txt
          echo "------------------------------------------"
          echo ""
          echo "ALL CHECKS PASSED!"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest test_app.py -v

  # ============================================
  # STAGE 2: BUILD & CREATE ARTIFACT
  # Package the project as a deployable artifact
  # ============================================
  build:
    name: Build & Package (CD)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Build Package
        run: |
          mkdir -p build
          cp app.py build/
          cp team_messages.txt build/
          cp requirements.txt build/
          echo "Build Date: $(date)" > build/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> build/BUILD_INFO.txt
          echo "Built by: GitHub Actions CI/CD Pipeline" >> build/BUILD_INFO.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-build
          path: build/

  # ============================================
  # STAGE 3: DEPLOY (Continuous Deployment)
  # Simulate deployment to production
  # ============================================
  deploy:
    name: Deploy to Production (CD)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: project-build
          path: deploy/

      - name: Simulate Deployment
        run: |
          echo "=========================================="
          echo "  DEPLOYING TO PRODUCTION"
          echo "=========================================="
          echo ""
          echo "Files being deployed:"
          ls -la deploy/
          echo ""
          echo "Build Info:"
          cat deploy/BUILD_INFO.txt
          echo ""
          echo "Team Messages:"
          cat deploy/team_messages.txt
          echo ""
          echo "=========================================="
          echo "  DEPLOYMENT SUCCESSFUL!"
          echo "=========================================="
