name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ============================================
  # STAGE 1: CONTINUOUS INTEGRATION (CI)
  # Automatically test code on every push
  # ============================================
  test:
    name: Run Tests (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest test_app.py -v

  # ============================================
  # STAGE 2: BUILD & CREATE ARTIFACT
  # Package the application as a deployable artifact
  # ============================================
  build:
    name: Build & Package (CD)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Build Directory
        run: |
          mkdir -p build
          cp app.py build/
          cp requirements.txt build/
          echo "Build Date: $(date)" > build/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> build/BUILD_INFO.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-app-build
          path: build/

  # ============================================
  # STAGE 3: DEPLOY (Continuous Deployment)
  # Simulate deployment to production
  # ============================================
  deploy:
    name: Deploy to Production (CD)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-app-build
          path: deploy/

      - name: Simulate Deployment
        run: |
          echo "=========================================="
          echo "  DEPLOYING TO PRODUCTION"
          echo "=========================================="
          echo ""
          echo "Files being deployed:"
          ls -la deploy/
          echo ""
          echo "Build Info:"
          cat deploy/BUILD_INFO.txt
          echo ""
          echo "Running application to verify:"
          cd deploy && python app.py
          echo ""
          echo "=========================================="
          echo "  DEPLOYMENT SUCCESSFUL!"
          echo "=========================================="
